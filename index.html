const SPR={};
function sprite(e){if(SPR[e])return SPR[e];const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');

function drawSprite(e,x,y,size,rot=0,alpha=1,sx=1,sy=1){if(alpha<=0.01||size<=1)return;const c=sprite(e);ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,sy);ctx.drawImage(c,-size/2,-size/2,size,size);ctx.restore();}

 ctx.font=o.ff?`${o.w||900} ${size}px ${o.ff}`:font(size,o.mono,o.w||900);ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(str,0,0);ctx.restore();}
function tw(str,size,mono){ctx.font=font(size,mono);return ctx.measureText(str).width;}
function typed(str,lt,cps=30,t0=0){return Array.from(str).slice(0,Math.max(0,Math.floor((lt-t0)*cps))).join('');}

function art(lines,cx,cy,size,col,o={}){const cw=size*0.602,lh=size*(o.lh||1.15);const mw=Math.max(...lines.map(l=>l.length))*cw;
 ctx.save();ctx.globalAlpha*=o.alpha??1;ctx.font=font(size,true);ctx.textAlign='left';ctx.textBaseline='middle';
 lines.forEach((l,i)=>{ctx.fillStyle=(o.cols&&o.cols[i])||col;ctx.fillText(l,cx-mw/2,cy+(i-(lines.length-1)/2)*lh);});ctx.restore();}
function dots(x0,y0,x1,y1,step,ch,size,col,alpha=1){const d=Math.hypot(x1-x0,y1-y0);const n=Math.max(1,Math.round(d/step));
 ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(size,true);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;
 for(let i=0;i<=n;i++){const f=i/n;ctx.fillText(typeof ch==='function'?ch(i,n):ch,x0+(x1-x0)*f,y0+(y1-y0)*f);}ctx.restore();}
function asciiRect(x0,y0,x1,y1,size,col,o={}){const sx=size*0.9,sy=size*1.1;ctx.save();ctx.font=font(size,true);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.globalAlpha*=o.alpha??1;
 const draw=o.draw??1;const per=2*(x1-x0)+2*(y1-y0);let acc=0;const vis=d=>d/per<=draw;
 for(let x=x0;x<=x1+0.1;x+=sx){const c=(x===x0||x+sx>x1+0.1)?'+':'-';if(vis(x-x0))ctx.fillText(c,x,y0);if(vis(per/2+(x-x0)))ctx.fillText(c,x,y1);}
 for(let y=y0+sy;y<y1-sy*0.4;y+=sy){if(vis((x1-x0)+(y-y0)))ctx.fillText('|',x1,y);if(vis(per/2+(x1-x0)+(y-y0))&&!(o.gapL&&y>o.gapL[0]&&y<o.gapL[1]))ctx.fillText('|',x0,y);}
 ctx.restore();}

// chars
function sub(S,a,b){return S.s.chars.slice(a,b).map((ch,j)=>({ch,i:a+j}));}
function mkChars(S,fs,src,mono){src=src||S.s.chars.map((ch,i)=>({ch,i}));ctx.font=font(fs,mono);
 return src.map(o=>({ch:o.ch,i:o.i,w:ctx.measureText(o.ch).width,fs,mono,x:0,y:0,rot:0,sc:1,sx:1,sy:1,a:1,vis:true}));}
function lineLayout(cs,cx,cy,ang=0,spacing=1){const tot=cs.reduce((a,c)=>a+c.w*spacing,0);let o=-tot/2;
 for(const c of cs){const off=o+c.w*spacing/2;c.x=cx+Math.cos(ang)*off;c.y=cy+Math.sin(ang)*off;c.rot=ang;c.bx=c.x;c.by=c.y;o+=c.w*spacing;}return cs;}
function leftLayout(cs,x0,cy){let x=x0;for(const c of cs){c.x=x+c.w/2;c.y=cy;c.bx=c.x;c.by=c.y;x+=c.w;}return cs;}
function pop(S,cs,o={}){const n=S.n;const stag=o.stag??Math.min(0.08,0.5/n);
 cs.forEach((c,k)=>{const ap=o.ap?o.ap(c.i,k):(o.delay||0)+k*stag;const p=clamp((S.lt-ap)/(o.d??0.25));c.p=p;if(p<=0){c.vis=false;return;}
  const e=easeOutCubic(p);c.a*=e;c.y+=(1-e)*(o.rise??26);c.sc*=o.pop?easeOutBack(p):(0.85+0.15*e);});return cs;}
function drawChar(S,c){if(!c.vis||c.a<=0.01||c.sc<=0.01)return;const fs=c.fs;const t=S.t;
 let jx=0,jy=0,sy=c.sy,a=c.a;
 if(!c.noP&&fs>=36){const hs=hash(c.i*31+(S.s.id||0)*7);
  if(c.ch==='痛'||c.ch==='疼'){jx=(hash(Math.floor(t*30)+c.i)-.5)*fs*0.06;jy=(hash(Math.floor(t*30)+c.i*3)-.5)*fs*0.05;}
  if(c.ch==='眼'&&((t*0.7+hs)%1)<0.07)sy*=0.12;
  if(c.ch==='忘')a*=0.55+0.45*(hash(Math.floor(t*12)+c.i)>0.25?1:0);
  if(c.ch==='累')jy+=fs*0.04;}
 ctx.save();ctx.globalAlpha=a;ctx.translate(c.x+jx,c.y+jy);ctx.rotate(c.rot);ctx.scale(c.sc*c.sx,c.sc*sy);
 if(c.clip){ctx.beginPath();if(c.clip==='top')ctx.rect(-fs,-fs,fs*2,fs);else ctx.rect(-fs,0,fs*2,fs);ctx.clip();}
 ctx.font=c.hand?`${fs}px "Ma Shan Zheng"`:c.pix?`${fs}px ${PIX}`:font(fs,c.mono);ctx.textAlign='center';ctx.textBaseline='middle';
 if(c.shadow){ctx.fillStyle=c.shadow;ctx.fillText(c.ch,fs*0.045,fs*0.06);}
 ctx.fillStyle=c.col||S.th.text;ctx.fillText(c.ch,0,0);
 if(c.strike){ctx.strokeStyle=c.strike;ctx.lineWidth=fs*0.09;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-c.w*0.62,fs*0.05);ctx.lineTo(-c.w*0.62+c.w*1.24*(c.strikeP??1),-fs*0.05);ctx.stroke();}
 ctx.restore();
 if(!c.noP&&fs>=36&&a>0.4)persona(S,c,jx,jy);}
function persona(S,c,jx,jy){const t=S.t,s=c.fs*c.sc,x=c.x+jx,y=c.y+jy,hs=hash(c.i*17+(S.s.id||0)*3),a=c.a;const dark=S.th.bg<'#8';
 switch(c.ch){
 case '困':for(let j=0;j<3;j++){const age=((t*0.7+j/3+hs)%1);text(j===1?'Z':'z',x+s*0.38+age*s*0.4,y-s*0.42-age*s*0.55,s*(0.2+age*0.16),dark?'#9fb6ff':'#5a6fb0',{mono:true,alpha:(1-age)*a});}break;
 case '累':{ctx.save();ctx.strokeStyle=dark?'#7f8fb8':'#4d5a86';ctx.globalAlpha=0.8*a;ctx.lineWidth=Math.max(2,s*0.03);ctx.lineCap='round';for(let k=0;k<3;k++){const lx=x-s*0.18+k*s*0.16;ctx.beginPath();ctx.moveTo(lx,y-s*0.62);ctx.lineTo(lx,y-s*0.36);ctx.stroke();}ctx.restore();}break;
 case '想':{const age=((t*0.9+hs)%1);text('♥',x+s*0.42,y-s*0.45-age*s*0.5,s*0.22,'#ff6f91',{mono:true,alpha:(1-age)*a});}break;
 case '痛':case '疼':drawSprite('💦',x+s*0.5,y-s*0.42,s*0.3,0.3,a);break;
 case '泪':case '怜':{const age=((t*0.8+hs)%1);drawSprite('💧',x+s*0.3,y+s*0.25+age*s*0.5,s*0.18,0,(1-age)*a);}break;
 case '笨':{const age=((t*0.9+hs)%1);text('?',x+s*0.45,y-s*0.5-age*s*0.2,s*0.3,dark?'#ffd166':'#d9772f',{mono:true,alpha:a*(age<0.8?1:(1-age)*5)});}break;
 case '眠':{const age=((t*0.6+hs)%1);text('z',x+s*0.4+age*s*0.2,y-s*0.45-age*s*0.3,s*0.2,dark?'#9fb6ff':'#5a6fb0',{mono:true,alpha:(1-age)*a});}break;
 case '魇':for(let j=0;j<2;j++){const age=((t*0.7+j/2+hs)%1);text('~',x-s*0.2+j*s*0.4+Math.sin(t*4+j)*s*0.05,y-s*0.5-age*s*0.4,s*0.28,'#a57bff',{mono:true,alpha:(1-age)*0.8*a});}break;
 case '烟':for(let j=0;j<2;j++){const age=((t*0.6+j/2+hs)%1);text('~',x+Math.sin(t*3+j*2)*s*0.12,y-s*0.55-age*s*0.5,s*(0.25+age*0.2),dark?'#aaa':'#999',{mono:true,alpha:(1-age)*0.8*a});}break;
 case '杀':drawSprite('💢',x+s*0.45,y-s*0.42,s*0.3,0,a*(0.6+0.4*Math.sin(t*8)));break;
 case '热':for(let j=0;j<3;j++)text('~',x-s*0.25+j*s*0.25,y-s*0.6+Math.sin(t*6+j)*s*0.04,s*0.2,'#ff7b7b',{mono:true,alpha:0.7*a});break;
 case '远':text('...',x+s*0.55,y+s*0.1,s*0.2,S.th.dim,{mono:true,alpha:a*0.8});break;
 }}
function drawChars(S,cs){for(const c of cs)drawChar(S,c);}
function charTop(c){return c.y-c.fs*0.5*c.sc*Math.abs(c.sy);}
function floorFn(cs,extra,def){return x=>{for(const c of cs){if(c.vis&&c.a>0.3&&Math.abs(x-c.x)<c.w*c.sc*0.42)return charTop(c)+c.fs*0.06;}for(const e of extra){if(x>=e.x0&&x<=e.x1)return e.y;}return def;};}
function asciiRain(S,o){const {t,lt}=S;if(lt<(o.start||0))return;ctx.save();ctx.font=font(o.size||28,true);ctx.textAlign='center';ctx.textBaseline='middle';
 for(let i=0;i<o.n;i++){const r1=hash(i*7+(o.seed||1)),r2=hash(i*13+(o.seed||1)*3);const x=o.x0+r1*(o.x1-o.x0);
  const floor=o.floor?o.floor(x):H+40;const sp=o.sp||(1100+r2*400);const fallT=Math.max(0.05,(floor-o.y0)/sp);const per=fallT+0.3;const tt=(t+r2*10)%per;
  const sl=o.slant||0;
  if(tt<fallT){const y=o.y0+tt*sp;const xx=x+sl*(y-floor);ctx.globalAlpha=o.alpha??0.8;
   if(o.sprite)drawSprite(o.sprite,xx,y,o.size||30);else{ctx.fillStyle=o.col;ctx.fillText(o.ch,xx,y);}}
  else if(floor<H){const d=(tt-fallT)/0.3;ctx.globalAlpha=(1-d)*(o.alpha??0.8);ctx.fillStyle=o.col||'#9cc8ff';
   if(o.ripple){ctx.strokeStyle=o.col;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,floor,8+d*50,3+d*9,0,0,Math.PI*2);ctx.stroke();}
   else{ctx.fillText('.',x-d*34,floor-Math.sin(d*Math.PI)*28);ctx.fillText('.',x+d*34,floor-Math.sin(d*Math.PI)*28);ctx.fillText('_',x,floor+4);}}}
 ctx.restore();}
// kaomoji (optionally with a little body)
function handPose(name,hw,t){const e=hw/2;const P={
 rest:{l:[-e-0.3,0.42],r:[e+0.3,0.42]},up:{l:[-e-0.42,-0.5],r:[e+0.42,-0.5]},push:{l:[e+0.2,-0.05],r:[e+0.38,0.38]},
 hold:{l:[-0.45,0.8],r:[0.45,0.8]},cover:{l:[-e*0.42,-0.02],r:[e*0.42,-0.02],op:['l','r']},
 coverL:{l:[-e*0.42,-0.02],r:[e+0.3,0.42],op:['l']},coverR:{l:[-e-0.3,0.42],r:[e*0.42,-0.02],op:['r']},
 head:{l:[-e-0.3,0.42],r:[e+0.08,-0.58]},head2:{l:[-e-0.1,-0.52],r:[e+0.1,-0.52]},
 left:{l:[-e-0.55,0.15],r:[-e-0.28,0.48]},right:{l:[e+0.28,0.48],r:[e+0.55,0.15]},limp:{l:[-e-0.18,0.68],r:[e+0.18,0.68]}};

 const hint=()=>{renderAt(0);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.font='bold 48px "DejaVu Sans Mono",monospace';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('▶ click to play  (space: pause)',W/2,H/2);};hint();
 let started=false,noAudio=false,t0=0;au.onerror=()=>{noAudio=true;};
 const now=()=>noAudio?(performance.now()-t0)/1000:au.currentTime;
 const loop=()=>{renderAt(Math.min(now(),130.6));if(!au.paused||noAudio)requestAnimationFrame(loop);};
 const toggle=()=>{if(!started){started=true;t0=performance.now();au.play().catch(()=>{noAudio=true;});requestAnimationFrame(loop);return;}if(au.paused){au.play();requestAnimationFrame(loop);}else au.pause();};
 cvs.addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}});
});}
</script></body></html>
